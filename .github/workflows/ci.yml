name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify action package
        run: |
          test -f action.yml
          test -f package.json
          test -f dist/index.js
          test -f README.md
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "require('fs').readFileSync('action.yml','utf8')"

  dist-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Build and verify source-map quality
        run: |
          npm run build
          npm run test:map-paths

      - name: Verify dist is committed and deterministic
        run: |
          git diff --exit-code -- dist || {
            echo "dist drift detected. Rebuild on Linux / run refresh-dist."
            exit 1
          }
